<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="redGradFinal2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff2020;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc0000;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Red circular background -->
  <circle cx="50" cy="50" r="48" fill="url(#redGradFinal2)"/>
  
  <!-- White circle border -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="white" stroke-width="1.3"/>
  
  <!-- Simple musical eighth note -->
  <g transform="translate(50, 50)">
    <!-- Note head (oval) -->
    <ellipse cx="-4" cy="12" rx="6" ry="7" fill="white" transform="rotate(-20 -4 12)"/>
    
    <!-- Stem -->
    <rect x="3" y="-15" width="2" height="29" fill="white" rx="1"/>
    
    <!-- Flag (beam) -->
    <path d="M 5 -15 Q 15 -12, 16 -6 L 5 -4 Z" fill="white"/>
  </g>
</svg>