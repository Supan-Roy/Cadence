<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="redGradFinal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff2020;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc0000;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Red circular background -->
  <circle cx="100" cy="100" r="95" fill="url(#redGradFinal)"/>
  
  <!-- White accent circle border -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="white" stroke-width="2.5"/>
  
  <!-- Simple musical eighth note -->
  <g transform="translate(100, 100)">
    <!-- Note head (oval) -->
    <ellipse cx="-8" cy="25" rx="12" ry="14" fill="white" transform="rotate(-20 -8 25)"/>
    
    <!-- Stem -->
    <rect x="6" y="-30" width="4" height="58" fill="white" rx="2"/>
    
    <!-- Flag (beam) -->
    <path d="M 10 -30 Q 30 -25, 32 -12 L 10 -8 Z" fill="white"/>
  </g>
</svg>